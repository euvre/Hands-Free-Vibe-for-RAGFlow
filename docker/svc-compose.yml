# svc-compose.yml — per-slot SIBLING service stack for one worker container.
#
# Started from run-slot.sh on the HOST (through the regular docker socket —
# the worker itself never runs a daemon; see docker/README.md):
#   HFV_SLOT=<n> docker compose -p hfv-svc-<n> --env-file <ragflow4>/docker/.env \
#     -f svc-compose.yml up -d
#
# Differences vs the host's ragflow4/docker/docker-compose-base.yml stack:
#   * NO published host ports — the worker reaches services by DNS name over
#     hfv-net-<n>; worker-entrypoint.sh socat-forwards container-localhost to
#     them, so the git-tracked conf/service_conf.yaml (localhost:1200 / 3306 /
#     6379 / 9000 / 4222) keeps working byte-identical. Zero cross-slot
#     conflicts, zero collisions with the host stack's published ports.
#   * no profiles: exactly the services the dev stack needs (elasticsearch +
#     metadata-mysql); opensearch/infinity/etc variants stay out.
#   * volumes are project-scoped (hfv-svc-<n>_esdata01, …): per-slot service
#     data persists across ticks like the long-lived host stack, so logins,
#     created datasets and ES indices survive between runs.
#   * NO tei here: embeddings are a stateless shared service — slots reuse the
#     host's tei-cpu via host.docker.internal:6380 (socat-forwarded by the
#     worker). No per-slot model download, no duplicated inference RAM.
#   * passwords/env come from the SAME host .env (RAGFLOW_DOCKER_DIR), so the
#     credentials baked into the tracked conf/service_conf.yaml keep matching.
services:
  es01:
    image: elasticsearch:${STACK_VERSION}
    volumes:
      - esdata01:/usr/share/elasticsearch/data
    # Official ES image ACL on /tmp denies writes for user elasticsearch (r-x only).
    # entrypoint.sh needs a writable temp dir for bash here-documents.
    tmpfs:
      - /tmp:mode=1777,size=512m
    env_file: ${RAGFLOW_DOCKER_DIR:-/home/inf/code/ragflow4/docker}/.env
    environment:
      - node.name=es01
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - bootstrap.memory_lock=false
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - cluster.routing.allocation.disk.watermark.low=5gb
      - cluster.routing.allocation.disk.watermark.high=3gb
      - cluster.routing.allocation.disk.watermark.flood_stage=2gb
    mem_limit: ${MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:9200"]
      interval: 10s
      timeout: 10s
      retries: 120
    networks: [hfv]
    restart: unless-stopped

  mysql:
    # mysql:5.7 linux/arm64 image is unavailable (kept from base compose).
    image: mysql:8.0.40
    env_file: ${RAGFLOW_DOCKER_DIR:-/home/inf/code/ragflow4/docker}/.env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
    command:
      --max_connections=1000
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --tls_version="TLSv1.2,TLSv1.3"
      --init-file /data/application/init.sql
      --binlog_expire_logs_seconds=604800
    volumes:
      - mysql_data:/var/lib/mysql
      - ${RAGFLOW_DOCKER_DIR:-/home/inf/code/ragflow4/docker}/init.sql:/data/application/init.sql:ro
    networks: [hfv]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  redis:
    # swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/valkey/valkey:8
    image: valkey/valkey:8
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]
    env_file: ${RAGFLOW_DOCKER_DIR:-/home/inf/code/ragflow4/docker}/.env
    volumes:
      - redis_data:/data
    networks: [hfv]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  minio:
    image: pgsty/silo:RELEASE.2026-08-06T00-00-00Z
    command: ["server", "--console-address", ":9001", "/data"]
    env_file: ${RAGFLOW_DOCKER_DIR:-/home/inf/code/ragflow4/docker}/.env
    environment:
      - MINIO_ROOT_USER=${MINIO_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [hfv]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 10s
      retries: 120
    restart: unless-stopped

  nats:
    image: nats:2.14.2
    volumes:
      - nats_data:/data
    command: -js -sd /data
    env_file: ${RAGFLOW_DOCKER_DIR:-/home/inf/code/ragflow4/docker}/.env
    networks: [hfv]
    healthcheck:
      test: ["CMD", "nats-server", "--health-check"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

volumes:
  esdata01:
  mysql_data:
  redis_data:
  minio_data:
  nats_data:

networks:
  hfv:
    # stable name so run-slot.sh can `docker run --network hfv-net-<n>` the
    # worker onto the same bridge as its service stack
    name: hfv-net-${HFV_SLOT:-0}