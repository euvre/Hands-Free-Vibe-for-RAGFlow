# task-services.conf — the in-container service stack under supervisord.
# One hfv-task container = one full stack; every state dir lives on the
# container layer so `docker commit` preserves it. Logins stay in
# /var/log/hfv-task/*.log. Priorities: mysql/es first (the data stores ragflow
# migrates against), the rest after. ragflow itself is NOT here — it is
# launched by the task flow (env-up.sh → framework/ragflow-up.sh), which also
# runs the DB init + migrations baked into docker/launch_backend_service.sh.

[program:mysql]
command=/usr/sbin/mysqld --user=mysql --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password --max_connections=1000 --binlog_expire_logs_seconds=604800
priority=10
stopasgroup=true
killasgroup=true
autorestart=true
stdout_logfile=/var/log/hfv-task/mysql.log
stderr_logfile=/var/log/hfv-task/mysql.err.log

[program:es]
# directory=: jvm.options' gc.log path is RELATIVE (file=logs/gc.log) — the ES
# process must start with ES_HOME as cwd, and logs/ must be writable by the
# elasticsearch user (path.logs only moves the main log, not the gc log).
directory=/usr/share/elasticsearch
command=su -s /bin/bash elasticsearch -c "ES_JAVA_OPTS='-Xms1g -Xmx1g' /usr/share/elasticsearch/bin/elasticsearch -Epath.data=/var/lib/elasticsearch -Epath.logs=/var/log/elasticsearch -Ehttp.port=1200 -Ediscovery.type=single-node -Expack.security.enabled=false -Expack.security.http.ssl.enabled=false -Expack.security.transport.ssl.enabled=false -Ecluster.routing.allocation.disk.watermark.low=5gb -Ecluster.routing.allocation.disk.watermark.high=3gb -Ecluster.routing.allocation.disk.watermark.flood_stage=2gb"
priority=10
stopasgroup=true
killasgroup=true
autorestart=true
stdout_logfile=/var/log/hfv-task/es.log
stderr_logfile=/var/log/hfv-task/es.err.log

[program:redis]
command=redis-server --requirepass infini_rag_flow --maxmemory 128mb --maxmemory-policy volatile-lru --dir /var/lib/redis --daemonize no
priority=20
stopasgroup=true
killasgroup=true
autorestart=true
stdout_logfile=/var/log/hfv-task/redis.log
stderr_logfile=/var/log/hfv-task/redis.err.log

[program:minio]
command=/usr/local/bin/minio server --console-address :9001 /data/minio
environment=MINIO_ROOT_USER="rag_flow",MINIO_ROOT_PASSWORD="infini_rag_flow"
priority=20
stopasgroup=true
killasgroup=true
autorestart=true
stdout_logfile=/var/log/hfv-task/minio.log
stderr_logfile=/var/log/hfv-task/minio.err.log

[program:nats]
command=/usr/local/bin/nats-server -js -sd /data/nats
priority=20
stopasgroup=true
killasgroup=true
autorestart=true
stdout_logfile=/var/log/hfv-task/nats.log
stderr_logfile=/var/log/hfv-task/nats.err.log
